<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>房间销毁器 · 交互自测</title>
<style>body{margin:0;background:#15161a;color:#ddd;font:13px/1.6 system-ui,"Microsoft YaHei",sans-serif}
#out{white-space:pre-wrap;padding:12px;font-family:Consolas,Menlo,monospace;font-size:12px}</style>
</head>
<body>
<pre id="out"></pre>
<script>
/* ---------------- 结果收集 ---------------- */
var lines = [], pass = 0, fail = 0;
function ok(name, cond, extra) {
  if (cond) { pass++; lines.push('  \u2713 ' + name); }
  else { fail++; lines.push('  \u2717 ' + name + (extra === undefined ? '' : '   [' + extra + ']')); }
}
function dump() { document.getElementById('out').textContent = lines.join('\n') + '\nSUMMARY ' + pass + '/' + (pass + fail); }

/* 固定角标（与源码里 NOTICE_TAG 一致），断言只从这一处引用 */
var TAG = '\n[\u8da3\u5473\u63d2\u4ef6 \u00b7 \u975e\u5b98\u65b9\u901a\u77e5]';

/* ---------------- 站点环境桩 ---------------- */
var syncCalls = [];
window.Utils = { sync: function (a, b) { syncCalls.push([a, b]); } };
var sounds = [];
window.Utils.Resource = { notiSound: function (n) { sounds.push(n); } };   // 站内系统提示音
window.Mod = { template: function (i, x) { return i === 29 ? '[' + x + ']' : '?'; } };
var ROOMNAME = '\u793e\u533a_\u7a7a\u95f4\u7ad9';       // 社区_空间站
window.Cookie = function (k, v) { if (arguments.length > 1) { ROOMNAME = String(v); return v; } return k === 'roomname' ? ROOMNAME : ''; };
window.roomn = 'R1';
window.Objs = { mapHolder: { Assets: { roomNameJson: { R1: '\u4f4f\u5b85_\u6d45\u9189' } } } };   // 住宅_浅醉

/* ---------------- 加载插件 ---------------- */
var s = document.createElement('script');
s.src = '../src/iirose-roomdestroy.js';
s.onload = start;
s.onerror = function () { ok('插件脚本加载', false); dump(); };
document.head.appendChild(s);

function pd(el, x, y) {
  el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, clientX: x, clientY: y, pointerId: 1 }));
}
function pu(el, x, y) {
  el.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, clientX: x, clientY: y, pointerId: 1 }));
}

function start() {
  var A = window.__IIROSE_ROOMDESTROY__;
  var fab = document.getElementById('iirose-roomdestroy-fab');
  var t = 0;
  try {

    lines.push('[1] 装载与就位');
    ok('对外入口挂上', !!A, typeof A);
    ok('版本号可取', !!(A && A.version), A && A.version);
    ok('悬浮球出现在页面上', !!fab);
    ok('悬浮球是固定定位', !!fab && fab.style.position === 'fixed', fab && fab.style.position);
    ok('_diag.currentRoomName() 取到 类型_房名',
      A._diag.currentRoomName() === '\u793e\u533a_\u7a7a\u95f4\u7ad9', A._diag.currentRoomName());

    lines.push('\n[2] 点击 = 弹站内原生提示（当前房）');
    var r = A.destroyRoomTip();
    ok('返回值 ok=true', r.ok === true, JSON.stringify(r).slice(0, 120));
    ok('文本 = 站内那一行 + 固定角标', r.text === '[\u793e\u533a_\u7a7a\u95f4\u7ad9]   \u5df2\u88ab\u9500\u6bc1' + TAG, r.text);
    ok('调用的是 Utils.sync(0, \u2026)', syncCalls.length === 1 && syncCalls[0][0] === 0, JSON.stringify(syncCalls).slice(0, 120));

    lines.push('\n[3] 点悬浮球本身（走 pointerup 判定）');
    syncCalls.length = 0;
    pd(fab, 100, 100); pu(fab, 100, 100);
    ok('轻点 → 弹了一次', syncCalls.length === 1, String(syncCalls.length));
    ok('轻点用的还是当前房名 + 角标',
      syncCalls[0] && syncCalls[0][1] === '[\u793e\u533a_\u7a7a\u95f4\u7ad9]   \u5df2\u88ab\u9500\u6bc1' + TAG,
      String(syncCalls[0] && syncCalls[0][1]));

    lines.push('\n[4] 拖动不误触');
    syncCalls.length = 0;
    fab.style.left = '200px'; fab.style.top = '200px';       // 固定起点，断言才有意义
    pd(fab, 200, 200);
    fab.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, clientX: 260, clientY: 240, pointerId: 1 }));
    pu(fab, 260, 240);
    ok('拖动后没有弹提示', syncCalls.length === 0, String(syncCalls.length));
    ok('拖动后的位置记进 localStorage', !!localStorage.getItem('iirose_roomdestroy_pos'), String(localStorage.getItem('iirose_roomdestroy_pos')));
    var saved = JSON.parse(localStorage.getItem('iirose_roomdestroy_pos') || '{}');
    ok('记住的位置 = 起点 + 位移', saved.left === 260 && saved.top === 240, JSON.stringify(saved));

    lines.push('\n[5] 房名取不到时不抛错');
    ROOMNAME = ''; window.Objs.mapHolder.Assets.roomNameJson = {};
    syncCalls.length = 0;
    var r2 = A.destroyRoomTip();
    ok('退化成房号', r2.raw === 'R1', r2.raw);
    ok('照样弹（不是静默失败）', r2.ok === true && syncCalls.length === 1, JSON.stringify(r2).slice(0, 120));

    lines.push('\n[6] 提示音：借站内自己的系统音');
    window.Objs.mapHolder.Assets.roomNameJson = {
      R1: '\u4f4f\u5b85_\u6d45\u9189',
      R9: '\u4f4f\u5b85_Ruby\u5bb6',
      '5b7ab839ace99': '\u793e\u533a_\u7a7a\u95f4\u7ad9'
    };
    ROOMNAME = '\u793e\u533a_\u7a7a\u95f4\u7ad9';
    try { localStorage.removeItem('iirose_roomdestroy_sound'); } catch (e) { }
    sounds.length = 0;
    var r4 = A.destroyRoomTip();
    ok('弹的时候调了站内信箱提示音 notiSound("mail")', sounds.length === 1 && sounds[0] === 'mail', JSON.stringify(sounds));
    ok('返回值标了音源 = site', r4.sound === 'site', r4.sound);
    A.setSound(false);
    sounds.length = 0;
    var r5 = A.destroyRoomTip();
    ok('关掉后不出声', sounds.length === 0 && r5.sound === 'muted', JSON.stringify(sounds) + ' / ' + r5.sound);
    ok('关掉后照样弹提示', r5.ok === true, JSON.stringify(r5.ok));
    A.setSound(true);
    ok('能再打开', A.soundOn() === true && A.soundOn() === true);

    lines.push('\n[7] 输入房号 / 房名弹（右键或长按悬浮球打开）');
    var box = document.getElementById('iirose-roomdestroy-box');
    ok('输入框在页面上', !!box);
    ok('默认收起', !!box && box.style.display === 'none', box && box.style.display);
    fab.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true }));
    ok('右键打开输入框', box.style.display === 'block', box.style.display);
    var inp = box.querySelector('input');
    var hint = box.querySelector('div');
    inp.value = '5b7ab839ace99';
    inp.dispatchEvent(new Event('input', { bubbles: true }));
    ok('提示行显示解析结果（房号 → 类型_房名）', hint.textContent.indexOf('\u793e\u533a_\u7a7a\u95f4\u7ad9') >= 0, hint.textContent);
    syncCalls.length = 0;
    inp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
    ok('回车 → 用房号解析出的房名弹 + 角标',
      syncCalls.length === 1 && syncCalls[0][1] === '[\u793e\u533a_\u7a7a\u95f4\u7ad9]   \u5df2\u88ab\u9500\u6bc1' + TAG,
      String(syncCalls[0] && syncCalls[0][1]));
    ok('弹完自动收起', box.style.display === 'none', box.style.display);

    A.openInput();
    var inp2 = box.querySelector('input');
    inp2.value = '\u6d45\u9189';
    inp2.dispatchEvent(new Event('input', { bubbles: true }));
    syncCalls.length = 0;
    box.querySelectorAll('button')[0].click();
    ok('裸房名 → 自动补类型前缀再弹 + 角标',
      syncCalls.length === 1 && syncCalls[0][1] === '[\u4f4f\u5b85_\u6d45\u9189]   \u5df2\u88ab\u9500\u6bc1' + TAG,
      String(syncCalls[0] && syncCalls[0][1]));

    A.openInput();
    box.querySelectorAll('button')[1].click();
    ok('取消 → 收起且不弹', box.style.display === 'none' && syncCalls.length === 1, box.style.display + ' / ' + syncCalls.length);
    A.openInput();
    inp2.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
    ok('Esc → 收起', box.style.display === 'none', box.style.display);

    lines.push('\n[8] 右键：只开输入框，不销毁');
    syncCalls.length = 0;
    A.openInput(); box.querySelectorAll('button')[1].click();          // 先收起
    fab.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, button: 2, pointerType: 'mouse' }));
    fab.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, cancelable: true, button: 2, pointerType: 'mouse' }));
    ok('右键不弹销毁', syncCalls.length === 0, 'sync ' + syncCalls.length + ' 次');
    fab.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true }));
    ok('右键打开输入框', box.style.display === 'block', box.style.display);
    box.querySelectorAll('button')[1].click();
    ok('收起后接着测', box.style.display === 'none');

    lines.push('\n[9] 触屏：点 = 输入房号；长按 2 秒 = 销毁当前房');
    syncCalls.length = 0;
    fab.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, button: 0, pointerType: 'touch' }));
    fab.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, cancelable: true, button: 0, pointerType: 'touch' }));
    ok('触屏轻点不销毁', syncCalls.length === 0, 'sync ' + syncCalls.length + ' 次');
    ok('触屏轻点打开输入框', box.style.display === 'block', box.style.display);
    box.querySelectorAll('button')[1].click();
    syncCalls.length = 0;
    fab.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, button: 0, pointerType: 'touch' }));
    setTimeout(function () {                                    // 等长按判定（2 秒）
      ok('长按 2 秒 = 销毁当前房', syncCalls.length === 1 && syncCalls[0][1].indexOf('\u5df2\u88ab\u9500\u6bc1') >= 0, String(syncCalls[0] && syncCalls[0][1]));
      ok('长按期间不会冒输入框', box.style.display === 'none', box.style.display);
      fab.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, cancelable: true, button: 0, pointerType: 'touch' }));
      ok('长按抬手不会重复弹', syncCalls.length === 1, 'sync ' + syncCalls.length + ' 次');
      fab.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true }));
      ok('触屏上的 contextmenu 不抢长按（不冒输入框）', box.style.display === 'none', box.style.display);
      rejectGroup();
    }, 2300);

    /* 改造根因：任意文本进不去，真房名照常 */
    function rejectGroup() {
      lines.push('\n[10] 拒绝任意文本（本次改造的根因）');
      window.Objs.mapHolder.Assets.roomNameJson = {
        R1: '\u4f4f\u5b85_\u6d45\u9189',
        R9: '\u4f4f\u5b85_Ruby\u5bb6',
        '5b7ab839ace99': '\u793e\u533a_\u7a7a\u95f4\u7ad9'
      };
      syncCalls.length = 0;
      var rBad = A.popTip('\u60a8\u5df2\u88ab\u5c01\u7981\n\u89e3\u5c01\u5012\u8ba1\u65f6\uff1a8848 \u5929\n\u5907\u6ce8\uff1ax');
      ok('假通知文案 → 一次都不弹', syncCalls.length === 0, 'sync ' + syncCalls.length + ' 次');
      ok('返回 ok=false + 说得清原因', rBad.ok === false && /\u6ca1\u8fd9\u4e2a\u623f\u95f4/.test(rBad.err), JSON.stringify(rBad).slice(0, 140));

      syncCalls.length = 0;
      A.popTip('<img src=x onerror=alert(1)>');
      ok('HTML 注入串 → 不弹', syncCalls.length === 0, 'sync ' + syncCalls.length + ' 次');

      A.popTip('\u4f4f\u5b85_\u6d45\u9189\u4e0d\u5b58\u5728');
      ok('名字带下划线但表里没有 → 不弹', syncCalls.length === 0, 'sync ' + syncCalls.length + ' 次');

      syncCalls.length = 0;
      var rGood = A.popTip('\u4f4f\u5b85_Ruby\u5bb6');
      ok('真房名照弹（没误伤）', rGood.ok === true && syncCalls.length === 1, JSON.stringify(rGood).slice(0, 140));
      ok('弹出的文本带固定角标', syncCalls[0][1].indexOf('\u975e\u5b98\u65b9\u901a\u77e5') >= 0, String(syncCalls[0] && syncCalls[0][1]));

      A.openInput();
      inp2.value = '\u60a8\u5df2\u88ab\u5c01\u7981';
      inp2.dispatchEvent(new Event('input', { bubbles: true }));
      ok('输入框小字当场说"没这个房间"', hint.textContent.indexOf('\u6ca1\u8fd9\u4e2a\u623f\u95f4') >= 0, hint.textContent);
      box.querySelectorAll('button')[1].click();
      finalUnmount();
    }

    function finalUnmount() {
      lines.push('\n[11] 手动指定 + 卸载');
      syncCalls.length = 0;
      var r3 = A.popTip('\u4f4f\u5b85_Ruby\u5bb6');
      ok('指定房名生效 + 角标', r3.text === '[\u4f4f\u5b85_Ruby\u5bb6]   \u5df2\u88ab\u9500\u6bc1' + TAG, r3.text);
      A.unmount();
      ok('卸载后悬浮球消失', !document.getElementById('iirose-roomdestroy-fab'));
      ok('卸载后输入框也消失', !document.getElementById('iirose-roomdestroy-box'));
      setTimeout(function () { ok('卸载后不会再被补回来', !document.getElementById('iirose-roomdestroy-fab')); dump(); }, 2400);
    }
  } catch (e) {
    ok('测试自身没抛错', false, e && e.message);
    dump();
  }
}
</script>
</body>
</html>
